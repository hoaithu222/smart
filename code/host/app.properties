# ================================================================
# Cấu hình phần mềm Thẻ sinh viên (Nhóm 1 - L02)
# Đặt file này ở thư mục gốc project NetBeans (cạnh thư mục src), hoặc cạnh file .jar.
# Dòng bắt đầu bằng # là chú thích. Bỏ trống giá trị = dùng mặc định.
# Giải thích từng khóa: notes/04-moi-truong-cau-hinh.md mục 6.
# ================================================================

# ---------- Thẻ ----------
# pcsc     = JCIDE (Enable PCSC Interface) hoặc đầu đọc thật  <- dùng khi báo cáo
# jcardsim = thẻ giả lập chạy ngay trong phần mềm, không cần mở JCIDE (tắt phần mềm là về thẻ trắng)
card.mode=pcsc
# Một phần tên đầu đọc. JCIDE: "JAVACOS Virtual". Để trống = tự chọn.
card.reader=JAVACOS Virtual
# T=0 như tài liệu của cô.
card.protocol=T=0
# Phải trùng Instance AID của applet trong JCIDE (Run or Debug Configuration).
card.aid=4B 4D 41 53 56 01 01
# Độ dài chuỗi ngẫu nhiên gửi thẻ ký khi xác thực (8..64).
card.challenge.bytes=16
# PIN quản trị nạp vào thẻ ở chế độ jcardsim (giống "Application Specific Parameters" trong JCIDE).
card.sim.adminPin=87654321

# ---------- CSDL: SQL Server ----------
# Bản Developer/Standard cài mặc định (instance MSSQLSERVER, cổng 1433):
db.url=jdbc:sqlserver://localhost:1433;databaseName=the_sinh_vien;encrypt=false
# Bản Express (instance SQLEXPRESS) - nhớ bật TCP/IP + dịch vụ SQL Server Browser:
#db.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=the_sinh_vien;encrypt=false
db.user=sa
db.password=
# Database chưa có thì phần mềm tự CREATE DATABASE rồi tự tạo bảng + dữ liệu mẫu.
db.autoCreate=true

# Chạy thử không cần SQL Server (bỏ # dòng dưới, thêm # vào dòng db.url ở trên):
#db.url=jdbc:sqlite:the_sinh_vien.db

# ---------- Nghiệp vụ ----------
app.pin.length=6
app.puk.length=8
# Nạp tối đa mỗi lần, đơn vị nghìn đồng (thẻ chặn tổng số dư ở 30000).
app.topup.max=5000
# Ảnh: thu nhỏ + nén JPEG cho vừa ô nhớ PHOTO trên thẻ (7680 byte sau đệm).
app.photo.maxBytes=7600
app.photo.width=120
app.photo.height=160
# Phòng mặc định của máy điểm danh (mã trong bảng phong; 0x0203 = 515).
app.checkin.room=0x0203

# ---------- Giao diện ----------
# light | dark | system
ui.theme=light
ui.font=Segoe UI
ui.fontSize=14

# ---------- Nhật ký ----------
# In APDU gửi/nhận ra cửa sổ Output của NetBeans (khung "Nhật ký APDU" trong phần mềm luôn có).
log.apdu=true
